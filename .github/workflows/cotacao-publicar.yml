name: Publicar cotação (Supabase + Cloudflare)

# Primeira publicação: roda quando cotacao-supabase/publicar.json (com o e-mail de login) é enviado.
# Depois disso: a cada alteração em cotacao/, publica o site de novo na Cloudflare Pages.
on:
  push:
    paths:
      - 'cotacao-supabase/publicar.json'
      - 'cotacao/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-cotacao-${{ github.ref }}
  cancel-in-progress: false

env:
  NOME_PROJETO: cotacoes-disppar

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ver o que mudou
        id: mudou
        env:
          TEM_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || git diff --name-only HEAD~1 HEAD | grep -q '^cotacao-supabase/publicar.json$'; then
            echo "configurar=sim" >> "$GITHUB_OUTPUT"
          fi
          if [ "$TEM_CLOUDFLARE" != "true" ]; then echo "tem_cloudflare=nao" >> "$GITHUB_OUTPUT"; fi

      - name: Criar e configurar Supabase e Cloudflare
        id: config
        if: steps.mudou.outputs.configurar == 'sim'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
        run: node cotacao-supabase/publicar.mjs

      - name: Salvar config.js no repositório
        if: steps.mudou.outputs.configurar == 'sim'
        run: |
          if git diff --quiet cotacao/config.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add cotacao/config.js
          git commit -m "Cotação: config.js do Supabase (gerado pelo workflow de publicação)"
          git push

      - name: Descobrir a conta da Cloudflare
        id: conta
        if: steps.mudou.outputs.tem_cloudflare != 'nao'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONTA_SEGREDO: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTA_CONFIG: ${{ steps.config.outputs.conta }}
        run: |
          conta="${CONTA_CONFIG:-$CONTA_SEGREDO}"
          if [ -z "$conta" ]; then
            conta=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          fi
          echo "id=$conta" >> "$GITHUB_OUTPUT"

      - name: Publicar o site na Cloudflare Pages
        if: steps.mudou.outputs.tem_cloudflare != 'nao'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.conta.outputs.id }}
        run: |
          if ! grep -q "supabaseUrl: 'https" cotacao/config.js; then
            echo "::notice::O Supabase ainda não foi configurado (config.js em branco). Envie cotacao-supabase/publicar.json para fazer a primeira publicação."
            exit 0
          fi
          npx --yes wrangler@3 pages deploy cotacao --project-name="$NOME_PROJETO" --branch="${{ github.ref_name }}" --commit-dirty=true

      - name: Resumo
        if: steps.config.outputs.site != ''
        run: |
          echo "### Sistema publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Site: ${{ steps.config.outputs.site }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Abra o e-mail de convite do Supabase para criar a senha." >> "$GITHUB_STEP_SUMMARY"
